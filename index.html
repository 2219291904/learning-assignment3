<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智学云课堂</title><link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"><style>body{margin:0;background:#f3f5f9;font-family:Arial,'Microsoft YaHei';color:#303133}header{background:white;display:flex;align-items:center;gap:30px;padding:14px max(20px,calc((100% - 1150px)/2))}header strong{white-space:nowrap;font-size:21px}main{max-width:1150px;margin:auto;padding:20px}.banner{height:300px;border-radius:8px;background:linear-gradient(115deg,#409eff,#67c23a);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column}.panel{background:white;padding:24px;margin-top:20px;border-radius:8px}h2{font-size:21px}small{color:#999;font-weight:normal;margin-left:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #eee;border-radius:8px;overflow:hidden}.cover{height:140px;display:grid;place-items:center;color:white;font-size:40px}.info{padding:16px}.info h3{font-size:16px}.muted{color:#999;font-size:13px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px;color:#f56c6c;font-weight:bold}footer{text-align:center;padding:30px;color:#999}@media(max-width:700px){.grid{grid-template-columns:1fr}header{gap:10px}.table{overflow:auto}}</style></head><body><div id="app"><header><strong>📘 智学云课堂</strong><el-input v-model="search" placeholder="搜索课程、讲师、分类..."><template #append><el-button @click="term=search">搜索</el-button></template></el-input><el-badge :value="6"><el-button circle>♧</el-button></el-badge><el-avatar>学</el-avatar></header><main><el-carousel height="300px"><el-carousel-item v-for="s in slides"><div class="banner" :style="{background:s.bg}"><h1>{{s.title}}</h1><p>{{s.desc}}</p><el-button round type="primary" @click="message('欢迎查看课程')">立即查看</el-button></div></el-carousel-item></el-carousel><section class="panel"><h2>精选课程 <small>跟随行业一线工程师学习</small></h2><el-tabs v-model="tab"><el-tab-pane label="全部" name="all"></el-tab-pane><el-tab-pane label="前端" name="前端"></el-tab-pane><el-tab-pane label="AI Coding" name="AI Coding"></el-tab-pane></el-tabs><div class="grid"><article class="card" v-for="c in shown"><div class="cover" :style="{background:c.color}">♧</div><div class="info"><el-tag size="small">{{c.type}}</el-tag><h3>{{c.name}}</h3><div class="muted">讲师：{{c.teacher}} · {{c.hours}}课时</div><div class="bottom">¥ {{c.price}}<el-button type="primary" size="small" round @click="message('开始学习：'+c.name)">立即学习</el-button></div></div></article></div><el-empty v-if="!shown.length" description="没有找到相关课程"></el-empty></section><section class="panel"><h2>我的学习记录 <small>坚持学习，持续进步</small></h2><div class="table"><el-table :data="records" style="min-width:700px"><el-table-column type="index" label="序号" width="70"></el-table-column><el-table-column prop="name" label="课程名称" min-width="200"></el-table-column><el-table-column prop="chapter" label="当前章节" min-width="200"></el-table-column><el-table-column label="学习进度" min-width="170"><template #default="s"><el-progress :percentage="s.row.progress"></el-progress></template></el-table-column><el-table-column label="状态" width="90"><template #default="s"><el-tag>{{s.row.progress===100?'已完成':'学习中'}}</el-tag></template></el-table-column><el-table-column label="操作" width="90"><template #default="s"><el-button link type="primary" @click="message('继续学习：'+s.row.name)">继续学习</el-button></template></el-table-column></el-table></div></section><section class="panel"><h2>帮助中心 <small>常见问题解答</small></h2><el-collapse v-model="active"><el-collapse-item title="如何申请课程退款？" name="1">购买课程 7 天内且学习进度不超过 30%，可在「我的订单」页面申请全额退款，款项将在 3 个工作日内原路退回。</el-collapse-item><el-collapse-item title="课程证书如何获取？" name="2">完成课程学习后，可在个人中心查看课程证书。</el-collapse-item><el-collapse-item title="课程有效期是多久？" name="3">具体有效期以课程说明为准。</el-collapse-item></el-collapse></section></main><footer>© 2026 智学云课堂 · 仅用于教学示范　<el-button link type="primary" @click="message('感谢您的反馈')">意见反馈</el-button></footer></div><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script><script>const {createApp,ref,computed}=Vue;createApp({setup(){const search=ref(''),term=ref(''),tab=ref('all'),active=ref(['1']);const slides=[{title:'前端进阶训练营 2026',desc:'从工程化到性能优化，全面实战',bg:'linear-gradient(115deg,#409eff,#67c23a)'},{title:'AI Coding 实战季',desc:'掌握 LLM 辅助开发，提升 10 倍效率',bg:'linear-gradient(115deg,#667eea,#764ba2)'},{title:'全栈进阶计划',desc:'前端 + Node + 云原生，一站式成长',bg:'linear-gradient(115deg,#ff9a56,#f56c6c)'}];const courses=[['前端','Vue3 组件库设计与实现','李伟',24,299,'#409eff'],['前端','React 18 并发渲染原理','王芳',18,199,'#67c23a'],['AI Coding','AI 辅助编程实战营','张磊',16,399,'#9b72cf'],['前端','TypeScript 类型体操进阶','陈静',20,249,'#e6a23c'],['AI Coding','Prompt 工程与 LLM 应用开发','赵强',14,349,'#f56c6c'],['前端','Vite 构建工具深度剖析','刘洋',12,159,'#55b8c9']].map(([type,name,teacher,hours,price,color])=>({type,name,teacher,hours,price,color}));const shown=computed(()=>courses.filter(c=>(tab.value==='all'||c.type===tab.value)&&(`${c.name} ${c.teacher} ${c.type}`.toLowerCase().includes(term.value.toLowerCase()))));const records=[{name:courses[0].name,chapter:'第 8 章：表单组件封装',progress:65},{name:courses[1].name,chapter:'第 5 章：Suspense 与并发模式',progress:42},{name:courses[2].name,chapter:'第 11 章：AI 代码评审',progress:100},{name:courses[3].name,chapter:'第 2 章：条件类型',progress:18}];return{search,term,tab,active,slides,shown,records,message:msg=>ElementPlus.ElMessage(msg)}}}).use(ElementPlus).mount('#app');</script></body></html>
